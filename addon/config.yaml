name: "Personal Cycling Agent"
version: "1.0.0"
slug: "personal_cycling_agent"
description: "Cycling telemetry analytics with Garmin Connect sync and AI insights"
url: "https://github.com/eddietheengineer/personal-cycling-agent"
arch:
  - aarch64
  - amd64
startup: application
ingress: true
ingress_port: 8501
panel_icon: "mdi:bicycle"
panel_title: "Cycling"
options:
  garmin_email: ""
  garmin_password: ""
  openai_api_key: ""
  openai_model: "gpt-4o"
  anthropic_api_key: ""
  anthropic_model: "claude-sonnet-4-20250514"
  sync_interval_hours: 24
  ftp_watts: 180
  max_hr: 0
schema:
  garmin_email: email
  garmin_password: password
  openai_api_key: password?
  openai_model: text
  anthropic_api_key: password?
  anthropic_model: text
  sync_interval_hours: integer
  ftp_watts: integer
  max_hr: integer
map:
  - type: share
    read_only: false
backup: hot
stage: stable